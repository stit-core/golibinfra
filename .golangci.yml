version: "2"
run:
  go: "1.26"
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errname
    - errorlint
    - forbidigo
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - revive
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
    - usetesting
  settings:
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^fmt\.Print(f|ln)?$'
          pkg: '^fmt$'
          msg: "log through logkit.Logger: it redacts and carries trace_id and request_id"
        - pattern: '^(print|println)$'
          msg: "log through logkit.Logger: it redacts and carries trace_id and request_id"
        - pattern: '^log\.'
          pkg: '^log$'
          msg: "log through logkit.Logger: it redacts and carries trace_id and request_id"
        - pattern: '^slog\.(Default|SetDefault|With|Log|LogAttrs|(Debug|Info|Warn|Error)(Context)?)$'
          pkg: '^log/slog$'
          msg: "the default slog logger bypasses logkit: take logkit.Logger as a dependency"
        - pattern: '^http\.(DefaultClient|Get|Head|Post|PostForm)$'
          pkg: '^net/http$'
          msg: "http.DefaultClient has no timeout: use httpclient or an http.Client with a Timeout"
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      rules:
        - name: var-naming
        - name: unused-parameter
          disabled: true
        - name: exported
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
          - noctx
          - bodyclose
          - forbidigo
        path: _test\.go
      # Инструменты гейта печатают свой отчёт в stdout — это их вывод, а не лог.
      - linters:
          - forbidigo
        path: ^scripts/
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra-rules: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
